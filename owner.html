<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Owner Panel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --blue: #3b82f6;
  --blue2: #60a5fa;
  --blue-dark: #1d4ed8;

  --bg: #030712;
  --bg2: #07101f;

  --card: rgba(255,255,255,.045);
  --card2: rgba(255,255,255,.025);

  --border: rgba(255,255,255,.09);

  --text: #f8fafc;
  --muted: #94a3b8;
  --muted2: #64748b;

  --green: #4ade80;
  --red: #f87171;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Poppins', sans-serif;

  color: var(--text);

  min-height: 100vh;

  padding:
    18px
    14px
    70px;

  overflow-x: hidden;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(59,130,246,.16),
      transparent 34%
    ),
    radial-gradient(
      circle at 100% 35%,
      rgba(29,78,216,.08),
      transparent 30%
    ),
    linear-gradient(
      160deg,
      var(--bg),
      var(--bg2) 55%,
      #030712
    );
}

/* Background glow */

body::before {
  content: "";

  position: fixed;

  width: 280px;
  height: 280px;

  left: -140px;
  top: 35%;

  border-radius: 50%;

  background:
    rgba(59,130,246,.06);

  filter: blur(80px);

  pointer-events: none;
}

body::after {
  content: "";

  position: fixed;

  width: 240px;
  height: 240px;

  right: -120px;
  top: 10%;

  border-radius: 50%;

  background:
    rgba(37,99,235,.06);

  filter: blur(80px);

  pointer-events: none;
}

.container {
  width: 100%;

  max-width: 720px;

  margin: auto;

  position: relative;

  z-index: 1;
}


/* =================================
   HEADER
================================= */

.page-header {
  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 12px;

  margin-bottom: 18px;

  animation:
    fadeUp .45s ease both;
}

.page-header h1 {
  display: flex;

  align-items: center;

  gap: 10px;

  font-size: 20px;

  font-weight: 600;
}

.page-header h1 i {
  width: 35px;
  height: 35px;

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 11px;

  color: var(--blue2);

  background:
    rgba(59,130,246,.1);

  border:
    1px solid rgba(59,130,246,.15);

  font-size: 15px;
}

.btn-back {
  display: inline-flex;

  align-items: center;

  gap: 7px;

  padding:
    9px
    13px;

  color: var(--muted);

  background:
    rgba(255,255,255,.04);

  border:
    1px solid var(--border);

  border-radius: 11px;

  font-family:
    'Poppins',
    sans-serif;

  font-size: 11.5px;

  text-decoration: none;

  transition:
    .2s ease;
}

.btn-back:hover {
  color: white;

  background:
    rgba(255,255,255,.07);

  transform:
    translateX(-2px);
}


/* =================================
   CARD
================================= */

.card {
  position: relative;

  overflow: hidden;

  padding: 21px;

  margin-bottom: 14px;

  border-radius: 21px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.025)
    );

  border:
    1px solid var(--border);

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  box-shadow:
    0 15px 45px rgba(0,0,0,.18);

  animation:
    fadeUp .5s ease both;
}

.card::before {
  content: "";

  position: absolute;

  width: 120px;
  height: 120px;

  right: -70px;
  top: -70px;

  border-radius: 50%;

  background:
    rgba(59,130,246,.06);

  filter:
    blur(25px);

  pointer-events: none;
}

.card-title {
  position: relative;

  display: flex;

  align-items: center;

  gap: 10px;

  margin-bottom: 18px;

  font-size: 14px;

  font-weight: 600;
}

.card-title i {
  width: 32px;
  height: 32px;

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 10px;

  color: var(--blue2);

  background:
    rgba(59,130,246,.1);

  border:
    1px solid rgba(59,130,246,.1);

  font-size: 13px;
}


/* =================================
   FORM
================================= */

label {
  display: block;

  margin-top: 15px;
  margin-bottom: 6px;

  color: var(--muted);

  font-size: 11.5px;
}

label:first-of-type {
  margin-top: 0;
}

input[type="text"],
textarea {
  width: 100%;

  padding:
    11px
    12px;

  outline: none;

  color: var(--text);

  background:
    rgba(255,255,255,.035);

  border:
    1px solid rgba(255,255,255,.08);

  border-radius: 11px;

  font-family:
    'Poppins',
    sans-serif;

  font-size: 12.5px;

  transition:
    border-color .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

input[type="text"]:focus,
textarea:focus {
  border-color:
    rgba(59,130,246,.55);

  background:
    rgba(59,130,246,.035);

  box-shadow:
    0 0 0 3px
    rgba(59,130,246,.06);
}

textarea {
  resize: vertical;

  min-height: 75px;
}

input::placeholder,
textarea::placeholder {
  color: #475569;
}


/* =================================
   PASSKEY
================================= */

input.passkey-input {
  max-width: 170px;

  text-align: center;

  letter-spacing: 6px;

  font-size: 17px;

  font-weight: 500;
}


/* =================================
   BUTTON
================================= */

.btn {
  border: none;

  cursor: pointer;

  font-family:
    'Poppins',
    sans-serif;

  font-weight: 500;

  transition:
    transform .15s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.btn:active {
  transform:
    scale(.96);
}

.btn-primary {
  display: inline-flex;

  align-items: center;

  justify-content: center;

  gap: 7px;

  margin-top: 15px;

  padding:
    10px
    16px;

  color: white;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--blue-dark)
    );

  border-radius: 11px;

  font-size: 12px;

  box-shadow:
    0 6px 20px
    rgba(37,99,235,.13);
}

.btn-primary:hover {
  box-shadow:
    0 8px 28px
    rgba(37,99,235,.3);

  transform:
    translateY(-1px);
}


/* =================================
   MESSAGE
================================= */

.save-msg {
  min-height: 17px;

  margin-top: 9px;

  font-size: 11px;
}

.save-msg.ok {
  color: var(--green);
}

.save-msg.err {
  color: var(--red);
}


/* =================================
   PROFILE PICTURE
================================= */

.pp-grid {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 10px;

  margin-top: 5px;
}

.pp-item {
  text-align: center;

  cursor: pointer;

  padding: 3px;

  border-radius: 15px;

  transition:
    transform .18s ease;
}

.pp-item:hover {
  transform:
    translateY(-2px);
}

.pp-item img {
  width: 100%;

  aspect-ratio: 1/1;

  object-fit: cover;

  display: block;

  margin-bottom: 6px;

  border-radius: 13px;

  border:
    2px solid transparent;

  background: #111827;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

.pp-item.active img {
  border-color:
    var(--blue);

  box-shadow:
    0 0 0 3px
    rgba(59,130,246,.1),
    0 8px 20px
    rgba(37,99,235,.18);
}

.pp-item span {
  color: var(--muted);

  font-size: 9.5px;
}


/* =================================
   CATEGORY
================================= */

.category-picker {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 9px;
}

.cat-btn {
  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 7px;

  min-height: 78px;

  color: var(--text);

  background:
    rgba(255,255,255,.035);

  border:
    1px solid rgba(255,255,255,.08);

  border-radius: 14px;

  font-family:
    'Poppins',
    sans-serif;

  font-size: 11px;

  cursor: pointer;

  transition:
    .2s ease;
}

.cat-btn i {
  color:
    var(--blue2);

  font-size: 18px;

  transition:
    transform .2s ease;
}

.cat-btn:hover {
  background:
    rgba(255,255,255,.06);

  transform:
    translateY(-2px);
}

.cat-btn:hover i {
  transform:
    scale(1.08);
}

.cat-btn.selected {
  color: #dbeafe;

  background:
    rgba(59,130,246,.1);

  border-color:
    rgba(59,130,246,.65);

  box-shadow:
    0 5px 20px
    rgba(37,99,235,.1);
}

.cat-btn.selected i {
  color:
    var(--blue2);
}


/* =================================
   PROJECT FORM
================================= */

#project-form {
  display: none;

  margin-top: 17px;

  padding-top: 17px;

  border-top:
    1px solid var(--border);

  animation:
    fadeUp .25s ease both;
}

#project-form.active {
  display: block;
}

.form-hint {
  margin-top: 5px;

  color:
    var(--muted2);

  font-size: 9.5px;

  line-height: 1.5;
}


/* =================================
   PROJECT LIST
================================= */

.project-row {
  display: flex;

  align-items: center;

  gap: 11px;

  padding:
    13px 0;

  border-bottom:
    1px solid var(--border);
}

.project-row:last-child {
  border-bottom: none;
}

.project-row-icon {
  width: 38px;
  height: 38px;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-shrink: 0;

  color:
    var(--blue2);

  background:
    rgba(59,130,246,.1);

  border:
    1px solid rgba(59,130,246,.1);

  border-radius: 11px;

  font-size: 13px;
}

.project-row-info {
  flex: 1;

  min-width: 0;
}

.project-row-info .title {
  font-size: 12.5px;

  font-weight: 500;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.project-row-info .desc {
  margin-top: 2px;

  color:
    var(--muted);

  font-size: 10.5px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.project-row-info .meta {
  margin-top: 3px;

  color:
    var(--muted2);

  font-size: 9px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.btn-delete {
  display: inline-flex;

  align-items: center;

  gap: 5px;

  flex-shrink: 0;

  padding:
    7px 9px;

  color:
    #fca5a5;

  background:
    rgba(248,113,113,.08);

  border:
    1px solid rgba(248,113,113,.2);

  border-radius: 9px;

  font-family:
    'Poppins',
    sans-serif;

  font-size: 9.5px;

  cursor: pointer;

  transition:
    .2s ease;
}

.btn-delete:hover {
  background:
    rgba(248,113,113,.15);

  border-color:
    rgba(248,113,113,.35);
}


/* =================================
   EMPTY
================================= */

.empty-state {
  padding:
    27px 10px;

  color:
    var(--muted2);

  text-align: center;

  font-size: 11.5px;

  border:
    1px dashed
    rgba(255,255,255,.1);

  border-radius: 15px;

  background:
    rgba(255,255,255,.012);
}


/* =================================
   ANIMATION
================================= */

@keyframes fadeUp {

  from {
    opacity: 0;

    transform:
      translateY(10px);
  }

  to {
    opacity: 1;

    transform:
      translateY(0);
  }

}


/* =================================
   MOBILE
================================= */

@media (max-width: 420px) {

  body {
    padding:
      13px
      11px
      55px;
  }

  .page-header h1 {
    font-size: 17px;
  }

  .page-header h1 i {
    width: 32px;
    height: 32px;
  }

  .card {
    padding: 17px;

    border-radius: 19px;
  }

  .pp-grid {
    grid-template-columns:
      repeat(2, 1fr);
  }

  .category-picker {
    gap: 7px;
  }

  .cat-btn {
    min-height: 70px;
  }

  .project-row {
    align-items: flex-start;
  }

  .btn-delete {
    padding:
      7px 8px;
  }

}

</style>
</head>


<body>

<div class="container">


  <!-- HEADER -->

  <div class="page-header">

    <h1>

      <i class="fa-solid fa-user-shield"></i>

      Owner Panel

    </h1>


    <a
      href="index.html"
      class="btn-back"
    >

      <i class="fa-solid fa-arrow-left"></i>

      Kembali

    </a>

  </div>


  <!-- =========================
       EDIT PROFIL
  ========================== -->

  <div class="card">

    <div class="card-title">

      <i class="fa-solid fa-id-card"></i>

      Edit Profil

    </div>


    <label>
      Nama Developer
    </label>

    <input
      type="text"
      id="input-name"
      placeholder="Nama kamu"
    >


    <label>
      Bio
    </label>

    <textarea
      id="input-bio"
      placeholder="Deskripsi singkat tentang kamu"
    ></textarea>


    <label>
      Pilih Foto Profil
    </label>

    <div
      class="pp-grid"
      id="pp-grid"
    ></div>


    <button
      class="btn btn-primary"
      id="btn-save-profile"
    >

      <i class="fa-solid fa-floppy-disk"></i>

      SIMPAN PROFIL

    </button>


    <div
      class="save-msg"
      id="profile-save-msg"
    ></div>

  </div>


  <!-- =========================
       PASSKEY
  ========================== -->

  <div class="card">

    <div class="card-title">

      <i class="fa-solid fa-key"></i>

      Set Passkey Owner

    </div>


    <label>
      Passkey (maks. 4 digit)
    </label>

    <input
      type="text"
      id="input-passkey"
      class="passkey-input"
      maxlength="4"
      inputmode="numeric"
      value="0701"
    >


    <button
      class="btn btn-primary"
      id="btn-save-passkey"
    >

      <i class="fa-solid fa-lock"></i>

      SIMPAN PASSKEY

    </button>


    <div
      class="save-msg"
      id="passkey-save-msg"
    ></div>

  </div>


  <!-- =========================
       TAMBAH PROJECT
  ========================== -->

  <div class="card">

    <div class="card-title">

      <i class="fa-solid fa-plus"></i>

      Tambah Project

    </div>


    <div class="category-picker">

      <button
        class="cat-btn"
        data-category="tools"
      >

        <i
          class="fa-solid fa-screwdriver-wrench"
        ></i>

        Tools

      </button>


      <button
        class="cat-btn"
        data-category="bug"
      >

        <i
          class="fa-solid fa-bug"
        ></i>

        Bug

      </button>


      <button
        class="cat-btn"
        data-category="game"
      >

        <i
          class="fa-solid fa-gamepad"
        ></i>

        Game

      </button>

    </div>


    <div
      id="project-form"
    >

      <label>
        Judul Project
      </label>

      <input
        type="text"
        id="input-title"
        placeholder="Contoh: Calculator"
      >


      <label>
        Deskripsi
      </label>

      <textarea
        id="input-desc"
        placeholder="Contoh: Kalkulator sederhana berbasis web"
      ></textarea>


      <label>
        Type (pisahkan dengan koma)
      </label>

      <input
        type="text"
        id="input-types"
        placeholder="Contoh: HTML, CSS, JS"
      >


      <label>
        Link Project
      </label>

      <input
        type="text"
        id="input-link"
        placeholder="https://contoh.com/calculator"
      >


      <div class="form-hint">

        Link wajib diisi dan harus valid
        (diawali http:// atau https://).

      </div>


      <button
        class="btn btn-primary"
        id="btn-add-project"
      >

        <i class="fa-solid fa-plus"></i>

        TAMBAHKAN PROJECT

      </button>


      <div
        class="save-msg"
        id="project-save-msg"
      ></div>

    </div>

  </div>


  <!-- =========================
       PROJECT LIST
  ========================== -->

  <div class="card">

    <div class="card-title">

      <i class="fa-solid fa-list"></i>

      Daftar Project

    </div>


    <div id="project-list">

      <div class="empty-state">

        Belum ada project.

      </div>

    </div>

  </div>


</div>


<script type="module">


/* =================================
   FIREBASE
================================= */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getDatabase,
  ref,
  get,
  set,
  push,
  remove,
  onValue
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyD2xNsbD6cNwivtuXFDUsOa6Z69hUaPY3",

  authDomain:
    "myprofil-777.firebaseapp.com",

  databaseURL:
    "https://myprofil-777-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "myprofil-777",

  storageBucket:
    "myprofil-777.firebasestorage.app",

  messagingSenderId:
    "176292026987",

  appId:
    "1:176292026987:web:78aa730a04c08e77502f2e",

  measurementId:
    "G-1821B6LQG8"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getDatabase(app);


/* =================================
   PROFILE PICTURES
================================= */

const profilePictures = [

  {
    name:
      "Default",

    url:
      "https://i.imgur.com/P1qJoOk.png"
  },

  {
    name:
      "Reverse card",

    url:
      "https://i.imgur.com/Oe5l0lZ.jpeg"
  },

  {
    name:
      "Flying Bird",

    url:
      "https://i.imgur.com/q9VnyaB.jpeg"
  },

  {
    name:
      "Galaksi cat",

    url:
      "https://i.imgur.com/u3TMSZ0.jpeg"
  },

  {
    name:
      "confused cat",

    url:
      "https://i.imgur.com/qNLFnED.jpeg"
  },

  {
    name:
      "anime kid",

    url:
      "https://i.imgur.com/9fHCoWI.jpeg"
  },

  {
    name:
      "Kilua",

    url:
      "https://i.imgur.com/WjcU58W.jpeg"
  },

  {
    name:
      "Sleppy cat",

    url:
      "https://i.imgur.com/afvAn06.jpeg"
  },

  {
    name:
      "Haimiya mio",

    url:
      "https://i.imgur.com/IXO54Bw.jpeg"
  }

];


let activePhotoUrl =
  null;


/* =================================
   PP GRID
================================= */

function renderPPGrid() {

  const grid =
    document.getElementById(
      "pp-grid"
    );


  grid.innerHTML =
    "";


  profilePictures.forEach(
    (pp) => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "pp-item" +
        (
          pp.url ===
          activePhotoUrl
            ? " active"
            : ""
        );


      item.innerHTML = `

        <img
          src="${pp.url}"
          alt="${pp.name}"
        >

        <span>
          ${pp.name}
        </span>

      `;


      item.addEventListener(
        "click",
        () => {

          activePhotoUrl =
            pp.url;

          renderPPGrid();

        }
      );


      grid.appendChild(
        item
      );

    }
  );

}


renderPPGrid();


/* =================================
   LOAD PROFILE
================================= */

const profileRef =
  ref(
    db,
    "profile"
  );


onValue(
  profileRef,
  (snapshot) => {

    const data =
      snapshot.val() || {};


    document.getElementById(
      "input-name"
    ).value =
      data.name || "";


    document.getElementById(
      "input-bio"
    ).value =
      data.bio || "";


    if (data.passkey) {

      document.getElementById(
        "input-passkey"
      ).value =
        data.passkey;

    }


    activePhotoUrl =
      data.photo || null;


    renderPPGrid();

  }
);


/* =================================
   SAVE PROFILE
================================= */

document
  .getElementById(
    "btn-save-profile"
  )
  .addEventListener(
    "click",
    async () => {

      const msgEl =
        document.getElementById(
          "profile-save-msg"
        );


      const name =
        document.getElementById(
          "input-name"
        ).value.trim();


      const bio =
        document.getElementById(
          "input-bio"
        ).value.trim();


      try {

        const snapshot =
          await get(
            profileRef
          );


        const current =
          snapshot.val() || {};


        await set(
          profileRef,
          {
            ...current,

            name,

            bio,

            photo:
              activePhotoUrl ||
              current.photo ||
              ""
          }
        );


        msgEl.textContent =
          "Profil berhasil disimpan.";


        msgEl.className =
          "save-msg ok";

      }

      catch (err) {

        msgEl.textContent =
          "Gagal menyimpan profil: " +
          err.message;


        msgEl.className =
          "save-msg err";

      }

    }
  );


/* =================================
   SAVE PASSKEY
================================= */

document
  .getElementById(
    "btn-save-passkey"
  )
  .addEventListener(
    "click",
    async () => {

      const msgEl =
        document.getElementById(
          "passkey-save-msg"
        );


      const passkeyInput =
        document.getElementById(
          "input-passkey"
        );


      const passkey =
        passkeyInput.value.trim();


      if (
        !/^\d{1,4}$/.test(
          passkey
        )
      ) {

        msgEl.textContent =
          "Passkey harus berupa angka, maksimal 4 digit.";


        msgEl.className =
          "save-msg err";


        return;

      }


      try {

        const snapshot =
          await get(
            profileRef
          );


        const current =
          snapshot.val() || {};


        await set(
          profileRef,
          {
            ...current,

            passkey
          }
        );


        msgEl.textContent =
          "Passkey berhasil disimpan.";


        msgEl.className =
          "save-msg ok";

      }

      catch (err) {

        msgEl.textContent =
          "Gagal menyimpan passkey: " +
          err.message;


        msgEl.className =
          "save-msg err";

      }

    }
  );


/* =================================
   CATEGORY
================================= */

let selectedCategory =
  null;


document
  .querySelectorAll(
    ".cat-btn"
  )
  .forEach(
    (btn) => {

      btn.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".cat-btn"
            )
            .forEach(
              b =>
                b.classList.remove(
                  "selected"
                )
            );


          btn.classList.add(
            "selected"
          );


          selectedCategory =
            btn.getAttribute(
              "data-category"
            );


          document
            .getElementById(
              "project-form"
            )
            .classList.add(
              "active"
            );


          document
            .getElementById(
              "project-save-msg"
            )
            .textContent =
            "";

        }
      );

    }
  );


/* =================================
   URL VALIDATION
================================= */

function isValidUrl(
  str
) {

  try {

    const u =
      new URL(str);


    return (
      u.protocol ===
        "http:" ||

      u.protocol ===
        "https:"
    );

  }

  catch {

    return false;

  }

}


/* =================================
   ADD PROJECT
================================= */

document
  .getElementById(
    "btn-add-project"
  )
  .addEventListener(
    "click",
    async () => {

      const msgEl =
        document.getElementById(
          "project-save-msg"
        );


      const title =
        document.getElementById(
          "input-title"
        ).value.trim();


      const description =
        document.getElementById(
          "input-desc"
        ).value.trim();


      const typesRaw =
        document.getElementById(
          "input-types"
        ).value.trim();


      const link =
        document.getElementById(
          "input-link"
        ).value.trim();


      if (!selectedCategory) {

        msgEl.textContent =
          "Pilih kategori project terlebih dahulu.";


        msgEl.className =
          "save-msg err";


        return;

      }


      if (!title) {

        msgEl.textContent =
          "Judul project wajib diisi.";


        msgEl.className =
          "save-msg err";


        return;

      }


      if (
        !link ||
        !isValidUrl(link)
      ) {

        msgEl.textContent =
          "Link project wajib diisi dan harus berupa URL yang valid.";


        msgEl.className =
          "save-msg err";


        return;

      }


      const types =
        typesRaw

          ? typesRaw
              .split(",")
              .map(
                t =>
                  t.trim()
              )
              .filter(Boolean)

          : [];


      try {

        const projectsRef =
          ref(
            db,
            "projects"
          );


        const newRef =
          push(
            projectsRef
          );


        await set(
          newRef,
          {

            id:
              newRef.key,

            category:
              selectedCategory,

            title,

            description,

            types,

            link,

            createdAt:
              Date.now()

          }
        );


        msgEl.textContent =
          "Project berhasil ditambahkan.";


        msgEl.className =
          "save-msg ok";


        document.getElementById(
          "input-title"
        ).value = "";


        document.getElementById(
          "input-desc"
        ).value = "";


        document.getElementById(
          "input-types"
        ).value = "";


        document.getElementById(
          "input-link"
        ).value = "";


        document
          .querySelectorAll(
            ".cat-btn"
          )
          .forEach(
            b =>
              b.classList.remove(
                "selected"
              )
          );


        document
          .getElementById(
            "project-form"
          )
          .classList.remove(
            "active"
          );


        selectedCategory =
          null;

      }

      catch (err) {

        msgEl.textContent =
          "Gagal menambahkan project: " +
          err.message;


        msgEl.className =
          "save-msg err";

      }

    }
  );


/* =================================
   PROJECT LIST
================================= */

const categoryIcon = {

  tools:
    "fa-screwdriver-wrench",

  bug:
    "fa-bug",

  game:
    "fa-gamepad"

};


function formatTanggalIndonesia(
  timestamp
) {

  if (!timestamp)
    return "-";


  const date =
    new Date(timestamp);


  return date.toLocaleDateString(
    "id-ID",
    {
      day:
        "numeric",

      month:
        "long",

      year:
        "numeric"
    }
  );

}


const projectsListRef =
  ref(
    db,
    "projects"
  );


const projectListEl =
  document.getElementById(
    "project-list"
  );


onValue(
  projectsListRef,
  (snapshot) => {

    const data =
      snapshot.val();


    projectListEl.innerHTML =
      "";


    if (!data) {

      projectListEl.innerHTML = `

        <div class="empty-state">

          Belum ada project.

        </div>

      `;

      return;

    }


    const projectArray =

      Object.entries(data)

        .map(
          ([id, val]) => ({
            id,
            ...val
          })
        )

        .sort(
          (a, b) =>
            (b.createdAt || 0) -
            (a.createdAt || 0)
        );


    projectArray.forEach(
      (project) => {

        const icon =
          categoryIcon[
            project.category
          ] ||
          "fa-folder";


        const types =
          Array.isArray(
            project.types
          )
            ? project.types.join(
                ", "
              )
            : "";


        const row =
          document.createElement(
            "div"
          );


        row.className =
          "project-row";


        row.innerHTML = `

          <div
            class="project-row-icon"
          >

            <i
              class="fa-solid ${icon}"
            ></i>

          </div>


          <div
            class="project-row-info"
          >

            <div
              class="title"
            >
              ${escapeHtml(
                project.title ||
                "-"
              )}
            </div>


            <div
              class="desc"
            >
              ${escapeHtml(
                project.description ||
                ""
              )}
            </div>


            <div
              class="meta"
            >
              ${escapeHtml(
                types
              )}

              &middot;

              ${formatTanggalIndonesia(
                project.createdAt
              )}

            </div>

          </div>


          <button
            class="btn-delete"
            data-id="${escapeAttr(
              project.id
            )}"
          >

            <i
              class="fa-solid fa-trash"
            ></i>

            HAPUS

          </button>

        `;


        projectListEl.appendChild(
          row
        );

      }
    );


    document
      .querySelectorAll(
        ".btn-delete"
      )
      .forEach(
        (btn) => {

          btn.addEventListener(
            "click",
            async () => {

              const id =
                btn.getAttribute(
                  "data-id"
                );


              const confirmed =
                confirm(
                  "Yakin ingin menghapus project ini?"
                );


              if (!confirmed)
                return;


              try {

                await remove(
                  ref(
                    db,
                    "projects/" +
                    id
                  )
                );

              }

              catch (err) {

                alert(
                  "Gagal menghapus project: " +
                  err.message
                );

              }

            }
          );

        }
      );

  }
);


/* =================================
   ESCAPE
================================= */

function escapeHtml(
  str
) {

  return String(str)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    );

}


function escapeAttr(
  str
) {

  return String(str)

    .replace(
      /"/g,
      "&quot;"
    );

}

</script>
